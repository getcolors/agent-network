---
# Teardown before infrastructure deletion. This deployment is disposable by
# design: nothing on it is worth a final archive, so the stack is simply
# stopped. The endpoint hostname and every peer identity die with the host and
# are regenerated by the next create.
- name: Stop the agent-network stack before infrastructure deletion
  hosts: agent-network
  become: true
  gather_facts: false
  tasks:
    - ansible.builtin.systemd_service:
        name: agent-network-firewall.service
        state: stopped
        enabled: false
      failed_when: false
    - ansible.builtin.command: docker compose --profile agent down
      args: {chdir: /opt/agent-network}
      register: compose_down
      changed_when: "'Removed' in (compose_down.stderr + compose_down.stdout)"
      failed_when: false
